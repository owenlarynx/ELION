<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Elion</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 30px auto; padding: 0 16px; background: #f4f4f4; }
    .karte { background: white; border: 1px solid #ddd; padding: 14px; margin: 8px 0; border-radius: 8px; }
    .klickbar { cursor: pointer; }
    .klickbar:hover { background: #fafafa; }
    button { padding: 8px 14px; margin: 4px; cursor: pointer; }
    textarea { width: 100%; height: 110px; padding: 8px; box-sizing: border-box; }
    .ampel { display: inline-block; width: 16px; height: 16px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
    .gruen { background: #4caf50; } .gelb { background: #ff9800; } .rot { background: #f44336; } .grau { background: #ccc; }
    .hidden { display: none; }
    .woche { display: flex; gap: 6px; margin-top: 8px; }
    .tag { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: white; }
  </style>
</head>
<body>
  <h1>Elion</h1>
  <p id="datum"></p>

  <div id="liste">
    <h2>Heute</h2>
    <div id="kinder"></div>
  </div>

  <div id="detail" class="hidden">
    <button onclick="zurueck()">← Zurück</button>
    <h2 id="kindName"></h2>
    <div id="kindInfo" class="karte"></div>

    <h3>Bericht für heute</h3>
    <textarea id="rohtext" placeholder="Wie war der Tag?"></textarea><br>
    <button onclick="speichern()">Speichern</button>
    <button onclick="pruefen()">Prüfen</button>
    <div id="pruefung" class="karte hidden"></div>

    <h3>Diese Woche</h3>
    <div id="woche" class="woche"></div>
  </div>

  <script>
    const API = "http://127.0.0.1:8000";
    let aktuellesKind = null;
    const heute = new Date().toISOString().slice(0,10);

    document.getElementById("datum").textContent = new Date().toLocaleDateString("de-DE", {weekday:"long", day:"numeric", month:"long"});

    function ampelKlasse(a) { return a ? a.toLowerCase() : "grau"; }

    async function ladeKinder() {
      const res = await fetch(API + "/kinder/");
      const kinder = await res.json();
      let html = "";
      for (const k of kinder) {
        const berichte = await (await fetch(API + "/tagesberichte/kind/" + k.id)).json();
        const heuteBericht = berichte.find(b => b.datum.startsWith(heute));
        const ampel = heuteBericht ? heuteBericht.ampel : null;
        html += `<div class="karte klickbar" onclick="oeffneKind(${k.id})">
          <span class="ampel ${ampelKlasse(ampel)}"></span>
          <b>${k.vorname}</b> ${k.nachname||""}
          <small>${heuteBericht ? "dokumentiert" : "offen"}</small>
        </div>`;
      }
      document.getElementById("kinder").innerHTML = html || "<p>Keine Kinder</p>";
    }

    async function oeffneKind(id) {
      aktuellesKind = id;
      const kind = await (await fetch(API + "/kinder/" + id)).json();
      document.getElementById("kindName").textContent = kind.vorname + " " + (kind.nachname||"");
      document.getElementById("kindInfo").innerHTML = `<b>Besonderheiten:</b> ${kind.besonderheiten||"-"}<br><b>Hinweise:</b> ${kind.dokumentationshinweise||"-"}`;

      const berichte = await (await fetch(API + "/tagesberichte/kind/" + id)).json();
      const heuteBericht = berichte.find(b => b.datum.startsWith(heute));
      document.getElementById("rohtext").value = heuteBericht ? heuteBericht.rohtext : "";
      zeigePruefung(heuteBericht);

      // Wochenübersicht (letzte 7 Tage)
      const woche = document.getElementById("woche");
      woche.innerHTML = "";
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const ds = d.toISOString().slice(0,10);
        const b = berichte.find(x => x.datum.startsWith(ds));
        const el = document.createElement("div");
        el.className = "tag " + ampelKlasse(b ? b.ampel : null);
        el.title = d.toLocaleDateString("de-DE");
        el.textContent = d.getDate();
        woche.appendChild(el);
      }

      document.getElementById("liste").classList.add("hidden");
      document.getElementById("detail").classList.remove("hidden");
    }

    function zeigePruefung(b) {
      const el = document.getElementById("pruefung");
      if (b && b.wrap_ergebnis) {
        el.classList.remove("hidden");
        el.innerHTML = `<span class="ampel ${ampelKlasse(b.ampel)}"></span><b>Prüfung</b><br>${b.wrap_ergebnis.replace(/\n/g,"<br>")}`;
      } else {
        el.classList.add("hidden");
      }
    }

    async function speichern() {
      const rohtext = document.getElementById("rohtext").value;
      if (!rohtext) return;
      await fetch(API + "/tagesberichte/", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({kind_id: aktuellesKind, datum: new Date().toISOString(), rohtext})
      });
      oeffneKind(aktuellesKind);
    }

    async function pruefen() {
      const berichte = await (await fetch(API + "/tagesberichte/kind/" + aktuellesKind)).json();
      const heuteBericht = berichte.find(b => b.datum.startsWith(heute));
      if (!heuteBericht) return alert("Bitte zuerst speichern");
      await fetch(API + "/tagesberichte/" + heuteBericht.id + "/pruefen", {method:"POST"});
      oeffneKind(aktuellesKind);
    }

    function zurueck() {
      document.getElementById("detail").classList.add("hidden");
      document.getElementById("liste").classList.remove("hidden");
      ladeKinder();
    }

    ladeKinder();
  </script>
</body>
</html>
