# Optional: ELION und Ollama zusammen starten.
# Erststart lädt das Modell (mehrere GB): docker compose up --build

services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama-pull:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull "$$OLLAMA_MODEL"
    restart: "no"

  elion:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      ELION_DATABASE_URL: sqlite:////data/elion.db
      ELION_PROMPT_PATH: /app/prompts/ra_thor_wrap.md
    volumes:
      - elion-data:/data
      - ./prompts/ra_thor_wrap.md:/app/prompts/ra_thor_wrap.md:ro
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  ollama:
  elion-data:
